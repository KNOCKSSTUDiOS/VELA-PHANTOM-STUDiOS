[workspace]
members = [
    "prompt_engine",
    "timeline_engine",
    "render_engine",
]
resolver = "2"

[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
prompt_engine = { path = "prompt_engine" }
timeline_engine = { path = "timeline_engine" }
render_engine = { path = "render_engine" }
eframe = "0.29"
egui = "0.29"
